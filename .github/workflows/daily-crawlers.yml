name: Daily Crawlers

on:
  schedule:
    # Daily crawlers (UTC time)
    - cron: '0 2 * * *'  # VocaDB crawler - 2:00 AM UTC (11:00 AM KST)
    - cron: '0 3 * * *'  # YouTube unified crawler - 3:00 AM UTC (12:00 PM KST)
                          # (includes view counts + Korean titles in single API call)

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      crawler:
        description: 'Which crawler to run'
        required: true
        type: choice
        options:
          - vocadb
          - youtube
          - all

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_URL: ${{ secrets.VERCEL_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  vocadb-crawler:
    name: VocaDB Crawler
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.crawler == 'vocadb' || github.event.inputs.crawler == 'all'))

    steps:
      - name: Trigger VocaDB Cron Endpoint
        run: |
          response=$(curl -L -X POST "${{ env.VERCEL_URL }}/api/cron/vocadb" \
            -H "Authorization: Bearer ${{ env.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s)

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "VocaDB crawler failed with status $http_code"
            exit 1
          fi

  youtube-crawler:
    name: YouTube Unified Crawler
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.crawler == 'youtube' || github.event.inputs.crawler == 'all'))

    steps:
      - name: Trigger YouTube Unified Cron Endpoint
        run: |
          # Unified crawler: fetches view counts + Korean titles in single API call
          # Uses: part=statistics,snippet,localizations
          response=$(curl -L -X POST "${{ env.VERCEL_URL }}/api/cron/youtube?mode=new" \
            -H "Authorization: Bearer ${{ env.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s)

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "YouTube unified crawler failed with status $http_code"
            exit 1
          fi
